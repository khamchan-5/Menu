<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการสั่งซื้อและชำระเงิน</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --dark: #0f172a;
        }

        body {
            background: #f1f5f9;
            font-family: 'Sukhumvit Set', sans-serif;
        }

        .history-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
        }

        .badge-paid {
            background: #dcfce7;
            color: #15803d;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-back:hover { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body>
    <div class="container" style="padding: 20px; max-width: 1100px; margin: 0 auto;">
        <!-- Header -->
        <div class="history-header">
            <div>
                <h1 style="margin:0; font-size:1.5rem;">📜 ประวัติการสั่งซื้อ & ชำระเงิน</h1>
                <small style="opacity:0.8;">รายการออเดอร์ที่เช็คบิลเรียบร้อยแล้วทั้งหมด</small>
            </div>
            <a href="admin.html" class="btn-back">⬅️ กลับหน้า Admin</a>
        </div>

        <!-- ยอดขายรวมสรุป -->
        <div class="summary-card">
            <div>
                <span style="color:#64748b; font-size:0.9rem;">ยอดขายรวมที่ได้รับชำระแล้ว</span>
                <h2 id="total-revenue" style="margin:5px 0 0 0; color:#10b981; font-size:1.8rem;">0 กีบ</h2>
            </div>
            <div>
                <span style="color:#64748b; font-size:0.9rem;">จำนวนออเดอร์ทั้งหมด</span>
                <h2 id="total-orders-count" style="margin:5px 0 0 0; color:#1e293b; font-size:1.8rem; text-align:right;">0 รายการ</h2>
            </div>
        </div>

        <!-- ตารางแสดงประวัติ -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>วันที่ / เวลา</th>
                        <th>โต๊ะ</th>
                        <th>รายการอาหาร</th>
                        <th>ราคารวม</th>
                        <th>สถานะ</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <tr>
                        <td colspan="5" style="text-align:center; color:#94a3b8; padding:30px;">กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="history.js"></script>
</body>
</html>
